  <text x="52" y="102" fill="#d8124c" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900">SYNC.</text>
  <text x="374" y="78" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25">DASHBOARD</text>
  <text x="536" y="78" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25" text-decoration="underline">PRODUCT CATALOG</text>
  <text x="746" y="78" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25">ORDER &amp; REQUEST</text>
  <text x="988" y="78" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="25">SALES</text>
