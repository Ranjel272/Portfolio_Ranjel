  <text x="640" y="366" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="22">Classic black leather heels with durable construction,</text>
  <text x="640" y="402" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="22">inventory details, supplier fields, and stock tracking.</text>
  <text x="640" y="492" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="34">Price: PHP 999</text>
  <text x="640" y="548" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="25">Quantity: 56</text>
  <text x="640" y="590" fill="#222" font-family="Arial, Helvetica, sans-serif" font-size="25">Category: Women's</text>
  <text x="262" y="594" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="24">Size and Chart</text>
