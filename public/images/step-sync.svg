<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Step Sync product catalog preview</title>
  <desc id="desc">A product catalog interface inspired by the Step Sync inventory screenshot.</desc>
  <rect width="1200" height="800" fill="#ededed"/>
  <rect x="0" y="0" width="1200" height="112" fill="#d8d5d4"/>
